<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Princess and the Moon — Pictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF9F5;
    --ink: #262420;
    --ink-soft: #6b665c;
    --line: #E4DFD3;
    --card: #FFFFFF;
    --young: #E8735C;
    --young-tint: #FBEAE6;
    --older: #2F7A6D;
    --older-tint: #E6F0EE;
    --tick: #3F9142;
    --danger: #C0463C;
    --accent: var(--young);
    --accent-tint: var(--young-tint);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px;
  }

  .screen{
    width:100%;
    max-width: 640px;
  }

  [hidden]{ display:none !important; }

  /* ---------- Landing ---------- */
  #landing{
    text-align:center;
  }

  .eyebrow{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }

  h1{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: clamp(28px, 6vw, 40px);
    line-height:1.15;
    margin: 0 0 40px;
  }

  .age-choices{
    display:flex;
    flex-direction:column;
    gap: 16px;
  }

  .age-btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 22px;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 26px 20px;
    cursor:pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .age-btn:hover{ transform: translateY(-2px); }
  .age-btn:active{ transform: translateY(0px); }
  .age-btn.young:hover{ border-color: var(--young); }
  .age-btn.older:hover{ border-color: var(--older); }

  .age-btn .sub{
    display:block;
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .manage-link{
    margin-top: 26px;
    font-family:'Inter', sans-serif;
    font-size: 14px;
    font-weight:500;
    color: var(--ink-soft);
    background:none;
    border:none;
    text-decoration: underline;
    cursor:pointer;
    padding: 6px 0;
  }
  .manage-link:hover{ color: var(--ink); }

  .copy-link{
    display:block;
    margin: 0 auto 14px;
    text-align:center;
  }

  /* ---------- Game ---------- */
  #game{
    width:100%;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
  }

  .change-age{
    font-family:'Inter', sans-serif;
    font-size: 14px;
    font-weight:500;
    color: var(--ink-soft);
    background:none;
    border:none;
    cursor:pointer;
    padding: 6px 0;
  }
  .change-age:hover{ color: var(--ink); }

  .progress{
    font-family:'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
  }

  .category-label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 36px;
    color: var(--accent);
    text-align:center;
    margin-bottom: 18px;
  }

  .card-wrap{
    position:relative;
  }

  .card{
    position:relative;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 24px;
    min-height: 300px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 28px;
    text-align:center;
    overflow:hidden;
  }

  .card-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
  }

  .icon{
    font-size: clamp(56px, 14vw, 84px);
    line-height:1;
  }
  .icon:empty{
    display:none;
  }

  .word{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: clamp(30px, 7vw, 46px);
    line-height:1.2;
    color: var(--ink);
  }

  .done-badge{
    position:absolute;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--tick);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 18px;
    font-weight:700;
    opacity:0;
    transform: scale(0.6);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .done-badge.show{
    opacity:1;
    transform: scale(1);
  }

  .tick-overlay{
    position:absolute;
    inset:0;
    background: var(--accent-tint);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.18s ease;
  }
  .tick-overlay.show{
    opacity:1;
    animation: pop 0.7s ease;
  }
  @keyframes pop{
    0%{ transform: scale(0.7); opacity:0; }
    35%{ transform: scale(1.06); opacity:1; }
    100%{ transform: scale(1); opacity:1; }
  }
  .tick-mark{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: var(--tick);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tick-mark svg{
    width: 48px;
    height: 48px;
    stroke: #fff;
    stroke-width: 4;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .controls{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-top: 22px;
  }

  .nav-btn{
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--card);
    font-size: 20px;
    color: var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: border-color 0.15s ease;
  }
  .nav-btn:hover{ border-color: var(--accent); }

  .pass-btn, .correct-btn, .danger-btn{
    flex:1;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 17px;
    padding: 16px 10px;
    border-radius: 16px;
    cursor:pointer;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .pass-btn:hover{ border-color: var(--ink-soft); }

  .correct-btn{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .correct-btn:hover{ filter: brightness(1.05); }

  .danger-btn{
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .danger-btn:hover{ filter: brightness(1.05); }

  /* ---------- Modals ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(38, 36, 32, 0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    z-index: 10;
  }

  .modal-box{
    background: var(--card);
    border-radius: 22px;
    padding: 36px 30px;
    max-width: 360px;
    width:100%;
    text-align:center;
  }

  .modal-emoji{
    font-size: 48px;
    margin: 0 0 10px;
  }

  .modal-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 24px;
    word-break: break-word;
  }

  .modal-actions{
    display:flex;
    gap: 10px;
  }

  /* ---------- Manage words ---------- */
  #manage{
    width:100%;
  }

  .manage-tabs{
    display:flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .tab-btn{
    flex:1;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 15px;
    padding: 12px 8px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .tab-btn.active.tab-young{ border-color: var(--young); color: var(--young); }
  .tab-btn.active.tab-older{ border-color: var(--older); color: var(--older); }

  .bank-count{
    font-size: 13px;
    color: var(--ink-soft);
    text-align:center;
    margin: 0 0 14px;
  }

  .word-list{
    max-height: 320px;
    overflow-y:auto;
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 6px;
    margin-bottom: 16px;
  }

  .word-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 12px;
    border-radius: 12px;
  }
  .word-item:not(:last-child){
    border-bottom: 1px solid var(--line);
  }

  .word-item-text{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size: 16px;
    color: var(--ink);
  }

  .delete-btn{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 20px;
    line-height:1;
    cursor:pointer;
  }
  .delete-btn:hover{
    background: #F3E9E7;
    color: var(--danger);
  }

  .empty-note{
    text-align:center;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 20px 10px;
  }

  .add-form{
    display:flex;
    gap: 8px;
  }

  .add-form input[type="text"]{
    font-family:'Inter', sans-serif;
    font-size: 15px;
    padding: 14px 14px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    color: var(--ink);
    outline:none;
  }
  .add-form input[type="text"]:focus{
    border-color: var(--accent);
  }

  #newWordText{ flex:1; min-width:0; }
  .icon-input{ width: 64px; text-align:center; flex: 0 0 auto; }

  .add-btn{ flex: 0 0 auto; padding: 14px 20px; }

  @media (max-width: 420px){
    .word{ font-size: clamp(24px, 8vw, 34px); }
    .nav-btn{ width: 44px; height: 44px; }
  }
</style>
</head>
<body>

  <div id="landing" class="screen">
    <p class="eyebrow">The Princess and the Moon</p>
    <h1>Who's drawing?<br>Pick the age group</h1>
    <div class="age-choices">
      <button class="age-btn young" onclick="startGame('young')">
        Ages 7 and below
        <span class="sub" id="youngSub">10 easy words to draw</span>
      </button>
      <button class="age-btn older" onclick="startGame('older')">
        Ages 7–12
        <span class="sub" id="olderSub">11 trickier words &amp; ideas</span>
      </button>
    </div>
    <button class="manage-link" onclick="openManage()">Manage word lists</button>
  </div>

  <div id="game" class="screen" hidden>
    <div class="topbar">
      <button class="change-age" onclick="goToLanding()">&larr; Change age</button>
      <span class="progress" id="categoryLabel"></span>
    </div>

    <p class="category-label" id="progress"></p>

    <div class="card-wrap">
      <div class="card" id="card">
        <div class="done-badge" id="doneBadge">&#10003;</div>
        <div class="card-content">
          <span class="icon" id="wordIcon"></span>
          <span class="word" id="wordText"></span>
        </div>
        <div class="tick-overlay" id="tickOverlay">
          <div class="tick-mark">
            <svg viewBox="0 0 24 24"><polyline points="4,13 10,19 20,6"></polyline></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="nav-btn" onclick="goPrev()" aria-label="Previous card">&#8592;</button>
      <button class="pass-btn" onclick="passCard()">Pass</button>
      <button class="correct-btn" onclick="markCorrect()">Got it &#10003;</button>
      <button class="nav-btn" onclick="goNext()" aria-label="Next card">&#8594;</button>
    </div>
  </div>

  <div id="manage" class="screen" hidden>
    <div class="topbar">
      <button class="change-age" onclick="goToLanding()">&larr; Back</button>
      <span class="progress">Manage words</span>
    </div>

    <div class="manage-tabs">
      <button class="tab-btn tab-young" id="tabYoung" onclick="switchManageTab('young')">Ages 7 &amp; below</button>
      <button class="tab-btn tab-older" id="tabOlder" onclick="switchManageTab('older')">Ages 7–12</button>
    </div>

    <p class="bank-count" id="bankCount"></p>
    <button class="manage-link copy-link" onclick="copyWordList()" id="copyBtn">Copy word list as text</button>

    <div class="word-list" id="wordList"></div>

    <div class="add-form">
      <input type="text" id="newWordText" placeholder="Add a word..." maxlength="40" onkeydown="if(event.key==='Enter')addWord()">
      <input type="text" id="newWordIcon" class="icon-input" placeholder="🙂" maxlength="4">
      <button class="correct-btn add-btn" onclick="addWord()">Add</button>
    </div>
  </div>

  <div id="completeModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p class="modal-emoji">🎉</p>
      <p class="modal-title">All cards have been answered!</p>
      <div class="modal-actions">
        <button class="pass-btn" onclick="closeModal()">Review cards</button>
        <button class="correct-btn" onclick="restartDeck()">Play again</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p class="modal-emoji">🗑️</p>
      <p class="modal-title" id="deleteModalText">Delete this word?</p>
      <div class="modal-actions">
        <button class="pass-btn" onclick="cancelDelete()">Cancel</button>
        <button class="danger-btn" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    /* Default seed words — only used the very first time this page runs on a device,
       to fill the saved word bank in localStorage. After that, the saved bank is used. */
    const DEFAULT_DECKS = {
      young: {
        label: "Ages 7 and below",
        accent: "--young",
        tint: "--young-tint",
        words: [
          { text: "Moon", icon: "🌙" },
          { text: "Rabbit", icon: "🐰" },
          { text: "Star", icon: "⭐" },
          { text: "Crown", icon: "👑" },
          { text: "Smile", icon: "😊" },
          { text: "Carrot", icon: "🥕" },
          { text: "Princess", icon: "👸" },
          { text: "Ball", icon: "⚽" },
          { text: "Dancing", icon: "💃" },
          { text: "Hug", icon: "🤗" }
        ]
      },
      older: {
        label: "Ages 7–12",
        accent: "--older",
        tint: "--older-tint",
        words: [
          { text: "Grumpy girl" }, { text: "Moon Rabbit" }, { text: "Moonbeam" },
          { text: "Kindness" }, { text: "Flying to the moon" }, { text: "Kind heart" },
          { text: "Eating steak" }, { text: "Smiling face" }, { text: "Friendship" },
          { text: "Prince and princess" }, { text: "Treasure other people" }
        ]
      }
    };

    const STORAGE_PREFIX = "ptm_words_";

    function loadBanks(){
      const result = {};
      ["young", "older"].forEach(key => {
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        if (raw){
          try{
            const parsed = JSON.parse(raw);
            result[key] = Array.isArray(parsed) ? parsed : DEFAULT_DECKS[key].words.slice();
          }catch(e){
            result[key] = DEFAULT_DECKS[key].words.slice();
          }
        } else {
          result[key] = DEFAULT_DECKS[key].words.slice();
        }
      });
      return result;
    }

    function saveBanks(){
      localStorage.setItem(STORAGE_PREFIX + "young", JSON.stringify(banks.young));
      localStorage.setItem(STORAGE_PREFIX + "older", JSON.stringify(banks.older));
    }

    let banks = loadBanks();
    let manageTab = "young";
    let pendingDeleteIndex = null;

    let session = null; // { key, words: [...], done: [...] }
    let currentIndex = 0;

    const landing = document.getElementById('landing');
    const game = document.getElementById('game');
    const manage = document.getElementById('manage');
    const wordText = document.getElementById('wordText');
    const wordIcon = document.getElementById('wordIcon');
    const categoryLabel = document.getElementById('categoryLabel');
    const progress = document.getElementById('progress');
    const doneBadge = document.getElementById('doneBadge');
    const tickOverlay = document.getElementById('tickOverlay');

    function shuffle(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickSessionWords(bank){
      const shuffled = shuffle(bank);
      return shuffled.slice(0, Math.min(10, shuffled.length));
    }

    function updateSubLabels(){
      document.getElementById('youngSub').textContent = banks.young.length + " word" + (banks.young.length === 1 ? "" : "s") + " in bank \u00b7 10 per game";
      document.getElementById('olderSub').textContent = banks.older.length + " word" + (banks.older.length === 1 ? "" : "s") + " in bank \u00b7 10 per game";
    }

    function startGame(key){
      const bank = banks[key];
      if (!bank || bank.length === 0){
        alert("Add some words to this list first, under \"Manage word lists.\"");
        return;
      }

      session = { key: key, words: pickSessionWords(bank) };
      session.done = new Array(session.words.length).fill(false);
      currentIndex = 0;

      const meta = DEFAULT_DECKS[key];
      const root = document.documentElement;
      root.style.setProperty('--accent', getComputedStyle(root).getPropertyValue(meta.accent));
      root.style.setProperty('--accent-tint', getComputedStyle(root).getPropertyValue(meta.tint));

      categoryLabel.textContent = meta.label;
      landing.hidden = true;
      manage.hidden = true;
      game.hidden = false;
      render();
    }

    function goToLanding(){
      game.hidden = true;
      manage.hidden = true;
      landing.hidden = false;
      session = null;
      updateSubLabels();
    }

    function render(){
      const item = session.words[currentIndex];
      wordText.textContent = item.text;
      wordIcon.textContent = item.icon || "";
      progress.textContent = (currentIndex + 1) + " / " + session.words.length;
      doneBadge.classList.toggle('show', !!session.done[currentIndex]);
      tickOverlay.classList.remove('show');
    }

    function goNext(){
      currentIndex = (currentIndex + 1) % session.words.length;
      render();
    }

    function goPrev(){
      currentIndex = (currentIndex - 1 + session.words.length) % session.words.length;
      render();
    }

    function passCard(){
      goNext();
    }

    function markCorrect(){
      session.done[currentIndex] = true;
      doneBadge.classList.add('show');
      tickOverlay.classList.add('show');

      const allDone = session.done.every(Boolean);

      setTimeout(() => {
        if (allDone){
          document.getElementById('completeModal').hidden = false;
        } else {
          goNext();
        }
      }, 700);
    }

    function closeModal(){
      document.getElementById('completeModal').hidden = true;
    }

    function restartDeck(){
      const bank = banks[session.key];
      session.words = pickSessionWords(bank);
      session.done = new Array(session.words.length).fill(false);
      currentIndex = 0;
      document.getElementById('completeModal').hidden = true;
      render();
    }

    /* ---------- Manage words ---------- */

    function openManage(){
      landing.hidden = true;
      manage.hidden = false;
      switchManageTab('young');
    }

    function switchManageTab(key){
      manageTab = key;
      document.getElementById('tabYoung').classList.toggle('active', key === 'young');
      document.getElementById('tabOlder').classList.toggle('active', key === 'older');
      document.getElementById('newWordIcon').hidden = (key !== 'young');
      renderManageList();
    }

    function renderManageList(){
      const bank = banks[manageTab];
      const listEl = document.getElementById('wordList');
      const countEl = document.getElementById('bankCount');
      countEl.textContent = bank.length + " word" + (bank.length === 1 ? "" : "s") + " saved \u00b7 each game uses 10" + (bank.length > 10 ? " (picked at random)" : "");

      listEl.innerHTML = "";

      if (bank.length === 0){
        const empty = document.createElement('p');
        empty.className = 'empty-note';
        empty.textContent = "No words yet — add your first one below.";
        listEl.appendChild(empty);
        return;
      }

      bank.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'word-item';

        const label = document.createElement('span');
        label.className = 'word-item-text';
        label.textContent = (item.icon ? item.icon + " " : "") + item.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.setAttribute('aria-label', 'Delete word');
        delBtn.innerHTML = '&times;';
        delBtn.onclick = () => requestDeleteWord(idx);

        row.appendChild(label);
        row.appendChild(delBtn);
        listEl.appendChild(row);
      });
    }

    function addWord(){
      const textInput = document.getElementById('newWordText');
      const iconInput = document.getElementById('newWordIcon');
      const text = textInput.value.trim();
      if (!text) return;

      const entry = { text: text };
      if (manageTab === 'young' && iconInput.value.trim()){
        entry.icon = iconInput.value.trim();
      }

      banks[manageTab].push(entry);
      saveBanks();

      textInput.value = "";
      iconInput.value = "";
      textInput.focus();
      renderManageList();
    }

    function copyWordList(){
      const bank = banks[manageTab];
      const label = DEFAULT_DECKS[manageTab].label;
      const lines = bank.map(item => (item.icon ? item.icon + " " : "") + item.text);
      const text = label + "\n" + lines.join("\n");

      const btn = document.getElementById('copyBtn');
      const showCopied = () => {
        const original = "Copy word list as text";
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(showCopied).catch(() => {
          window.prompt("Copy this text:", text);
        });
      } else {
        window.prompt("Copy this text:", text);
      }
    }

    function requestDeleteWord(idx){
      pendingDeleteIndex = idx;
      const item = banks[manageTab][idx];
      document.getElementById('deleteModalText').textContent = 'Delete "' + item.text + '"?';
      document.getElementById('deleteModal').hidden = false;
    }

    function cancelDelete(){
      pendingDeleteIndex = null;
      document.getElementById('deleteModal').hidden = true;
    }

    function confirmDelete(){
      if (pendingDeleteIndex !== null){
        banks[manageTab].splice(pendingDeleteIndex, 1);
        saveBanks();
      }
      pendingDeleteIndex = null;
      document.getElementById('deleteModal').hidden = true;
      renderManageList();
    }

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (game.hidden) return;
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft') goPrev();
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); markCorrect(); }
    });

    updateSubLabels();
  </script>

</body>
</html>
